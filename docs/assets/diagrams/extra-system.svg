<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" role="img" aria-labelledby="title desc"><title id="title">Extra AGL execution models</title><desc id="desc">A dedicated cluster system and a shared-kernel container host with cluster and Momi guests.</desc><rect width="960" height="495" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172b44"><text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold">Extra AGL system: two execution models</text><rect x="30" y="70" width="420" height="80" rx="12" fill="#e4f0ff" stroke="#536b87"/><text x="240.0" y="98" text-anchor="middle" font-size="18" font-weight="bold">Dedicated Qt or Slint cluster</text><text x="240.0" y="121" text-anchor="middle" font-size="14">Cluster application and profile services</text><rect x="510" y="70" width="195" height="80" rx="12" fill="#e4f0ff" stroke="#536b87"/><text x="607.5" y="98" text-anchor="middle" font-size="18" font-weight="bold">Cluster guest</text><text x="607.5" y="121" text-anchor="middle" font-size="14">Separate userland</text><rect x="725" y="70" width="205" height="80" rx="12" fill="#e4f0ff" stroke="#536b87"/><text x="827.5" y="98" text-anchor="middle" font-size="18" font-weight="bold">Momi IVI guest</text><text x="827.5" y="121" text-anchor="middle" font-size="14">Qt/QML userland</text><path d="M240 150v130M610 150v25M825 150v25" stroke="#536b87" stroke-width="3"/><rect x="510" y="175" width="420" height="80" rx="12" fill="#e8f6ed" stroke="#536b87"/><text x="720.0" y="203" text-anchor="middle" font-size="18" font-weight="bold">Container Manager / DRM leases</text><text x="720.0" y="226" text-anchor="middle" font-size="14">Guest lifecycle and display ownership</text><path d="M720 255v25" stroke="#536b87" stroke-width="3"/><rect x="30" y="280" width="420" height="80" rx="12" fill="#fff0d6" stroke="#536b87"/><text x="240.0" y="308" text-anchor="middle" font-size="18" font-weight="bold">Cluster Linux kernel</text><text x="240.0" y="331" text-anchor="middle" font-size="14">Dedicated system drivers</text><rect x="510" y="280" width="420" height="80" rx="12" fill="#fff0d6" stroke="#536b87"/><text x="720.0" y="308" text-anchor="middle" font-size="18" font-weight="bold">Shared host Linux kernel</text><text x="720.0" y="331" text-anchor="middle" font-size="14">Guest device access and isolation</text><path d="M240 360v25M720 360v25" stroke="#536b87" stroke-width="3"/><rect x="30" y="385" width="420" height="80" rx="12" fill="#edf0f5" stroke="#536b87"/><text x="240.0" y="413" text-anchor="middle" font-size="18" font-weight="bold">Cluster board</text><text x="240.0" y="436" text-anchor="middle" font-size="14">Boot the cluster disk image</text><rect x="510" y="385" width="420" height="80" rx="12" fill="#edf0f5" stroke="#536b87"/><text x="720.0" y="413" text-anchor="middle" font-size="18" font-weight="bold">Integration board</text><text x="720.0" y="436" text-anchor="middle" font-size="14">Boot host plus guest filesystems</text></g></svg>
