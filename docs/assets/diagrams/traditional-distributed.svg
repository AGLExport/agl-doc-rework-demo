<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" width="720" height="382" role="img" aria-labelledby="title description">
<title id="title">Traditional distributed architecture</title>
<desc id="description">Six function-specific ECUs connect to a vehicle network. Each ECU has its own software environment.</desc>
<rect width="720" height="382" rx="14" fill="#ffffff" stroke="#d7e0e8"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="34" text-anchor="middle" font-size="21" fill="#172b45">Functions on separate ECUs</text><path d="M 116 190 L 604 190" fill="none" stroke="#476780" stroke-width="3"/><text x="240" y="172" text-anchor="middle" font-size="17" fill="#172b45">Vehicle network</text><path d="M 122 132 L 122 190" fill="none" stroke="#476780" stroke-width="3"/><path d="M 122 190 L 122 254" fill="none" stroke="#476780" stroke-width="3"/><rect x="24" y="70" width="196" height="62" rx="10" fill="#edf3fa" stroke="#315b82" stroke-width="2"/><text x="122.0" y="107.0" text-anchor="middle" font-size="18" fill="#172b45">IVI ECU</text><rect x="24" y="254" width="196" height="62" rx="10" fill="#edf3fa" stroke="#315b82" stroke-width="2"/><text x="122.0" y="291.0" text-anchor="middle" font-size="18" fill="#172b45">Body control ECU</text><path d="M 360 132 L 360 190" fill="none" stroke="#476780" stroke-width="3"/><path d="M 360 190 L 360 254" fill="none" stroke="#476780" stroke-width="3"/><rect x="262" y="70" width="196" height="62" rx="10" fill="#edf3fa" stroke="#315b82" stroke-width="2"/><text x="360.0" y="107.0" text-anchor="middle" font-size="18" fill="#172b45">Cluster ECU</text><rect x="262" y="254" width="196" height="62" rx="10" fill="#edf3fa" stroke="#315b82" stroke-width="2"/><text x="360.0" y="291.0" text-anchor="middle" font-size="18" fill="#172b45">Powertrain ECU</text><path d="M 598 132 L 598 190" fill="none" stroke="#476780" stroke-width="3"/><path d="M 598 190 L 598 254" fill="none" stroke="#476780" stroke-width="3"/><rect x="500" y="70" width="196" height="62" rx="10" fill="#edf3fa" stroke="#315b82" stroke-width="2"/><text x="598.0" y="107.0" text-anchor="middle" font-size="18" fill="#172b45">Gateway ECU</text><rect x="500" y="254" width="196" height="62" rx="10" fill="#edf3fa" stroke="#315b82" stroke-width="2"/><text x="598.0" y="291.0" text-anchor="middle" font-size="18" fill="#172b45">Driver assistance ECU</text><text x="360" y="358" text-anchor="middle" font-size="17" fill="#172b45">Each ECU hosts its own function-specific software.</text></g>
</svg>
