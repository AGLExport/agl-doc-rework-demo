<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">AGL Container integration reference architecture</title>
  <desc id="desc">Type 2a runs a Qt Instrument Cluster guest and a Momi IVI guest on one LXC host and one Linux kernel. Type 2b installs Qt and Flutter IVI alternatives, with one active guest per IVI role. Container Manager and liblxc manage both guest roles. The host DRM lease manager transfers leased file descriptors over Unix sockets; guests render directly through kernel DRM/KMS. Optional audio hooks require an installed and configured host service. Separate guest root filesystems share the underlying storage and kernel.</desc>
