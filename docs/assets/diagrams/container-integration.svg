  <text x="40" y="48" class="title" font-family="Arial,Helvetica,sans-serif" fill="#172c40" font-size="30" font-weight="700">AGL Container integration</text>
  <text x="40" y="78" class="body muted" font-family="Arial,Helvetica,sans-serif" fill="#466078" font-size="20">Current IC/IVI reference profile / shared Linux kernel / reviewed 8 October 2026</text>
