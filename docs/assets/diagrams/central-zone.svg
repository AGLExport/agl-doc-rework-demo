<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 458" width="720" height="458" role="img" aria-labelledby="title description">
<title id="title">Central and zonal architecture</title>
<desc id="description">Central computing hosts consolidated workloads. Three physical zone controllers connect nearby sensors and actuators to the backbone.</desc>
<rect width="720" height="458" rx="14" fill="#ffffff" stroke="#d7e0e8"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="34" text-anchor="middle" font-size="21" fill="#172b45">Central computing with physical zones</text><rect x="140" y="66" width="440" height="72" rx="10" fill="#24486b" stroke="#24486b" stroke-width="2"/><text x="360.0" y="96.0" text-anchor="middle" font-size="18" fill="#ffffff">Central computing</text><text x="360.0" y="120.0" text-anchor="middle" font-size="18" fill="#ffffff">Consolidated workloads</text><path d="M 360 138 L 360 196" fill="none" stroke="#476780" stroke-width="3"/><path d="M 122 196 L 598 196" fill="none" stroke="#476780" stroke-width="3"/><text x="240" y="178" text-anchor="middle" font-size="17" fill="#172b45">Vehicle backbone</text><path d="M 122 196 L 122 234" fill="none" stroke="#476780" stroke-width="3"/><path d="M 122 296 L 122 340" fill="none" stroke="#476780" stroke-width="3"/><rect x="24" y="234" width="196" height="62" rx="10" fill="#e3f4ee" stroke="#287b62" stroke-width="2"/><text x="122.0" y="259.0" text-anchor="middle" font-size="18" fill="#164d3d">Front-left zone</text><text x="122.0" y="283.0" text-anchor="middle" font-size="18" fill="#164d3d">controller</text><rect x="24" y="340" width="196" height="62" rx="10" fill="#f3f4f6" stroke="#7b8794" stroke-width="2"/><text x="122.0" y="365.0" text-anchor="middle" font-size="18" fill="#263546">Nearby sensors</text><text x="122.0" y="389.0" text-anchor="middle" font-size="18" fill="#263546">and actuators</text><path d="M 360 196 L 360 234" fill="none" stroke="#476780" stroke-width="3"/><path d="M 360 296 L 360 340" fill="none" stroke="#476780" stroke-width="3"/><rect x="262" y="234" width="196" height="62" rx="10" fill="#e3f4ee" stroke="#287b62" stroke-width="2"/><text x="360.0" y="259.0" text-anchor="middle" font-size="18" fill="#164d3d">Front-right zone</text><text x="360.0" y="283.0" text-anchor="middle" font-size="18" fill="#164d3d">controller</text><rect x="262" y="340" width="196" height="62" rx="10" fill="#f3f4f6" stroke="#7b8794" stroke-width="2"/><text x="360.0" y="365.0" text-anchor="middle" font-size="18" fill="#263546">Nearby sensors</text><text x="360.0" y="389.0" text-anchor="middle" font-size="18" fill="#263546">and actuators</text><path d="M 598 196 L 598 234" fill="none" stroke="#476780" stroke-width="3"/><path d="M 598 296 L 598 340" fill="none" stroke="#476780" stroke-width="3"/><rect x="500" y="234" width="196" height="62" rx="10" fill="#e3f4ee" stroke="#287b62" stroke-width="2"/><text x="598.0" y="259.0" text-anchor="middle" font-size="18" fill="#164d3d">Rear zone</text><text x="598.0" y="283.0" text-anchor="middle" font-size="18" fill="#164d3d">controller</text><rect x="500" y="340" width="196" height="62" rx="10" fill="#f3f4f6" stroke="#7b8794" stroke-width="2"/><text x="598.0" y="365.0" text-anchor="middle" font-size="18" fill="#263546">Nearby sensors</text><text x="598.0" y="389.0" text-anchor="middle" font-size="18" fill="#263546">and actuators</text><text x="360" y="434" text-anchor="middle" font-size="17" fill="#172b45">Zones group device connections by physical location.</text></g>
</svg>
