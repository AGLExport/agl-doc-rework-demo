<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
<title id="title">AGL master Connected Gateway architecture</title>
<desc id="description">CAN frames pass from vehicle ECUs or a demo generator into the gateway CAN provider. DBC and VSS mappings convert data for the local KUKSA databroker. Configured IVI, Cluster and data applications access signals over IP. The image also installs agl-vss-proxy. Collection, cellular and cloud processing are optional integration work.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#345979"/></marker></defs>
