<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" width="720" height="382" role="img" aria-labelledby="title description">
<title id="title">Domain architecture</title>
<desc id="description">Cockpit, body, and powertrain domain controllers communicate over a backbone and manage devices grouped by function.</desc>
<rect width="720" height="382" rx="14" fill="#ffffff" stroke="#d7e0e8"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="34" text-anchor="middle" font-size="21" fill="#172b45">Functions grouped into logical domains</text><path d="M 126 78 L 594 78" fill="none" stroke="#476780" stroke-width="3"/><text x="360" y="64" text-anchor="middle" font-size="17" fill="#172b45">Vehicle backbone</text><path d="M 122 78 L 122 120" fill="none" stroke="#476780" stroke-width="3"/><path d="M 122 192 L 122 256" fill="none" stroke="#476780" stroke-width="3"/><rect x="24" y="120" width="196" height="72" rx="10" fill="#edf3fa" stroke="#315b82" stroke-width="2"/><text x="122.0" y="150.0" text-anchor="middle" font-size="18" fill="#172b45">Cockpit domain</text><text x="122.0" y="174.0" text-anchor="middle" font-size="18" fill="#172b45">controller</text><rect x="24" y="256" width="196" height="58" rx="10" fill="#f3f4f6" stroke="#7b8794" stroke-width="2"/><text x="122.0" y="291.0" text-anchor="middle" font-size="18" fill="#263546">IVI and cluster</text><path d="M 360 78 L 360 120" fill="none" stroke="#476780" stroke-width="3"/><path d="M 360 192 L 360 256" fill="none" stroke="#476780" stroke-width="3"/><rect x="262" y="120" width="196" height="72" rx="10" fill="#edf3fa" stroke="#315b82" stroke-width="2"/><text x="360.0" y="150.0" text-anchor="middle" font-size="18" fill="#172b45">Body domain</text><text x="360.0" y="174.0" text-anchor="middle" font-size="18" fill="#172b45">controller</text><rect x="262" y="256" width="196" height="58" rx="10" fill="#f3f4f6" stroke="#7b8794" stroke-width="2"/><text x="360.0" y="291.0" text-anchor="middle" font-size="18" fill="#263546">Doors and lighting</text><path d="M 598 78 L 598 120" fill="none" stroke="#476780" stroke-width="3"/><path d="M 598 192 L 598 256" fill="none" stroke="#476780" stroke-width="3"/><rect x="500" y="120" width="196" height="72" rx="10" fill="#edf3fa" stroke="#315b82" stroke-width="2"/><text x="598.0" y="150.0" text-anchor="middle" font-size="18" fill="#172b45">Powertrain domain</text><text x="598.0" y="174.0" text-anchor="middle" font-size="18" fill="#172b45">controller</text><rect x="500" y="256" width="196" height="58" rx="10" fill="#f3f4f6" stroke="#7b8794" stroke-width="2"/><text x="598.0" y="291.0" text-anchor="middle" font-size="18" fill="#263546">Engine and drivetrain</text><text x="360" y="358" text-anchor="middle" font-size="17" fill="#172b45">Related functions share a domain controller.</text></g>
</svg>
