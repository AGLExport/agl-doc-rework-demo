site_name: AGL Documentation
site_description: Task-oriented guides, concepts, and references for Automotive Grade Linux.
site_url: !ENV [MKDOCS_SITE_URL, "http://127.0.0.1:8000/"]
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/source/img/agl.png
  favicon: assets/source/img/favicon.ico
  font: false
  features:
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
plugins:
- search:
    lang:
    - en
    separator: '[\s\-_]+'
- macros:
    on_error_fail: true
    j2_comment_start_string: "{##"
    j2_comment_end_string: "##}"
hooks:
- hooks/site.py
markdown_extensions:
- admonition
- attr_list
- md_in_html
- toc:
    permalink: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.superfences
- pymdownx.details
- pymdownx.tasklist:
    custom_checkbox: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
extra_css:
- assets/stylesheets/extra.css
extra:
  documentation_layout: hierarchy
  source_review_date: 2026-10-10
  agl:
    codename: master
    full_name: AGL master
  yocto:
    codename: wrynose
    version: 6.0.x
  qt_layer_branch: '6.12'
  artifact_kind: snapshots
