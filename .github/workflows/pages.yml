name: Build and deploy AGL documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref_type == 'branch' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out sources
        uses: actions/checkout@v7.0.1

      - name: Locate documentation project
        id: docs
        run: |
          if [[ -f GitHubPages/mkdocs.yml ]]; then
            docs_root=GitHubPages
          elif [[ -f mkdocs.yml ]]; then
            docs_root=.
          else
            echo "MkDocs configuration was not found." >&2
            exit 1
          fi
          printf 'root=%s\n' "$docs_root" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ steps.docs.outputs.root }}/requirements.txt

      - name: Install documentation dependencies
        env:
          DOCS_ROOT: ${{ steps.docs.outputs.root }}
        run: python -m pip install -r "$DOCS_ROOT/requirements.txt"

      - name: Read GitHub Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build documentation
        env:
          DOCS_ROOT: ${{ steps.docs.outputs.root }}
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url || 'http://127.0.0.1:8000' }}/
        run: |
          python -m mkdocs build \
            --strict \
            --config-file "$DOCS_ROOT/mkdocs.yml" \
            --site-dir "$GITHUB_WORKSPACE/_site"

      - name: Validate generated links and anchors
        env:
          DOCS_ROOT: ${{ steps.docs.outputs.root }}
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url || 'http://127.0.0.1:8000' }}/
        run: |
          python "$DOCS_ROOT/scripts/validate_site.py" \
            "$GITHUB_WORKSPACE/_site" --site-url "$MKDOCS_SITE_URL"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
